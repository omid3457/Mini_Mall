name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Mini_Mall/Mini_Mall.csproj') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore Mini_Mall/Mini_Mall.csproj

      - name: Build
        run: dotnet build Mini_Mall/Mini_Mall.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test Mini_Mall/Mini_Mall.csproj --no-build --configuration Release --verbosity minimal
