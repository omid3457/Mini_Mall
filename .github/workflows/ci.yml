name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Mini_Mall/Mini_Mall.csproj') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore Mini_Mall/Mini_Mall.csproj

      - name: Build
        run: dotnet build Mini_Mall/Mini_Mall.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test Mini_Mall/Mini_Mall.csproj --no-build --configuration Release --verbosity minimal

      - name: Publish
        run: dotnet publish Mini_Mall/Mini_Mall.csproj --no-build --configuration Release -o ./publish

      - uses: actions/upload-artifact@v4
        with:
          name: minimall
          path: publish/

      - name: Pack publish output
        run: tar -czf Mini_Mall.tar.gz -C publish .

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" Mini_Mall.tar.gz \
            --title "Build ${{ github.run_number }}" \
            --notes "Publish output from ${{ github.sha }}"
